[project]
name = "spark-streaming"
version = "0.1.0"
description = "Production-grade Spark Structured Streaming pipeline with Apache Iceberg, Kafka, and Real-Time Fraud Detection"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Data Engineering Team" }
]
dependencies = [
    "confluent-kafka>=2.16.0",
    "duckdb>=2.0.0",
    "faker>=40.43.0",
    "pydantic>=2.14.1",
    "pyiceberg>=0.9.0",
    "pyspark>=4.1.3,<4.2.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "streamlit>=1.66.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
