services:
  # ==========================================
  # 1. Apache Kafka (KRaft mode, no Zookeeper)
  # ==========================================
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    ports:
      - "29092:29092"
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 5

  # ==========================================
  # 2. Kafka UI (Web Console on :8080)
  # ==========================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  # ==========================================
  # 3. MinIO (S3-compatible Object Storage)
  # ==========================================
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    command: ["server", "/data", "--console-address", ":9001"]

  # MinIO Bucket Auto-Initializer via AWS CLI
  minio-init:
    image: amazon/aws-cli:latest
    container_name: minio-init
    depends_on:
      - minio
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password123
      AWS_REGION: us-east-1
    entrypoint: >
      sh -c "
      until aws --endpoint-url http://minio:9000 s3 mb s3://warehouse 2>/dev/null || aws --endpoint-url http://minio:9000 s3 ls s3://warehouse 2>/dev/null; do
        echo 'Waiting for MinIO service to respond...';
        sleep 2;
      done;
      echo 'MinIO warehouse bucket initialized successfully!';
      exit 0;
      "

  # ==========================================
  # 4. Apache Iceberg REST Catalog
  # ==========================================
  iceberg-rest:
    image: tabulario/iceberg-rest:0.8.0
    container_name: iceberg-rest
    ports:
      - "8181:8181"
    environment:
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      CATALOG_S3_ACCESS__KEY__ID: admin
      CATALOG_S3_SECRET__ACCESS__KEY: password123
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password123
      AWS_REGION: us-east-1
    depends_on:
      minio-init:
        condition: service_completed_successfully

  # ==========================================
  # 5. Spark Runtime Container (PySpark 4.1.3 + Iceberg 1.12.0 + Kafka)
  # ==========================================
  spark:
    build:
      context: .
      dockerfile: docker/Dockerfile.spark
    container_name: spark-streaming-engine
    ports:
      - "4040:4040"  # Spark Driver Web UI
    environment:
      - SPARK_HOME=/opt/spark
      - PYTHONPATH=/opt/spark/python:/opt/spark/python/lib/py4j-0.10.9.9-src.zip:/opt/spark/work-dir/src
      - SPARK_NO_DAEMONIZE=true
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password123
      - AWS_REGION=us-east-1
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - ICEBERG_REST_URI=http://iceberg-rest:8181
      - S3_ENDPOINT=http://minio:9000
    volumes:
      - ./src:/opt/spark/work-dir/src
      - ./checkpoints:/opt/spark/work-dir/checkpoints
    depends_on:
      kafka:
        condition: service_healthy
      iceberg-rest:
        condition: service_started
    command: tail -f /dev/null
